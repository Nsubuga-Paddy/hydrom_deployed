# Railway / Nixpacks: Django (Python) + Vite build (Node).
# Do not enable the "node" provider alongside nodejs_* — it conflicts on corepack shims.
providers = ["python"]

[phases.setup]
nixPkgs = ["python310", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt",
  "cd web && npm ci",
]

[phases.build]
cmds = [
  "cd web && npm run build",
  "python3 manage.py collectstatic --noinput",
]

[start]
cmd = "gunicorn hydromapp.wsgi --log-file -"
