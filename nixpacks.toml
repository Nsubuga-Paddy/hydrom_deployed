# Railway / Nixpacks: Django (Python provider) + Vite build (Node from nixPkgs).
# Do not enable the "node" provider alongside nodejs_* — it conflicts on corepack shims.
providers = ["python"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "cd web && npm ci",
]

[phases.build]
cmds = [
  "cd web && npm run build",
  "python manage.py collectstatic --noinput",
]

[start]
cmd = "gunicorn hydromapp.wsgi --log-file -"
